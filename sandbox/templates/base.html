<!doctype html>
<html><head><meta charset="utf-8"><title>{% block title %}Mock ERP{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 12px}
nav a{margin-right:12px} label{display:block;margin-top:10px} input,select{padding:4px;min-width:240px}
button{margin-top:14px;padding:6px 12px} table{border-collapse:collapse} td,th{border:1px solid #ccc;padding:4px 8px}
.flash-ok{background:#d8f5d8;padding:8px;margin:8px 0} .flash-err{background:#fbd9d9;padding:8px;margin:8px 0}
</style></head><body>
<nav>{% if session.get('user') %}<a href="/vendors">Vendors</a><a href="/invoices">Invoices</a><a href="/invoices/new">New invoice</a><a href="/pos">Purchase orders</a>{% endif %}</nav>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash-{{ cat }}">{{ msg }}</div>{% endfor %}
{% block body %}{% endblock %}
</body></html>
