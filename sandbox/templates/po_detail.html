{% extends "base.html" %}{% block body %}<h1>Purchase order {{ r.po_number }}</h1>
<table>
<tr><th>PO number</th><td id="f-po_number">{{ r.po_number }}</td></tr>
<tr><th>Vendor</th><td id="f-vendor">{{ r.vendor }}</td></tr>
<tr><th>Order date</th><td id="f-order_date">{{ r.order_date }}</td></tr>
<tr><th>Status</th><td id="f-status">{{ r.status }}</td></tr></table>
{% if r.status == 'open' %}<form method="post" action="/pos/{{ r.id }}/receive"><button type="submit" data-role="submit-record">Mark as received</button></form>{% endif %}{% endblock %}
